<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Harta orașelor în care flota CibeRO este activă." />
  <title>Orașe active | CibeRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../main-page.css?v=8" />
</head>
<body>
  <header class="site-header secondary-header">
    <a class="secondary-back" href="../">← Înapoi la CibeRO</a>
    <a class="brand brand-wordmark" href="../" aria-label="Pagina principală CibeRO"><img src="../assets/cibero-wordmark.png" alt="CibeRO" /></a>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main>
    <section class="cities-section standalone-cities" aria-labelledby="cities-title">
      <header class="cities-heading">
        <p>Acoperire CibeRO</p>
        <h1 id="cities-title">Orașele în care flota este activă</h1>
        <span>Harta prezintă exclusiv orașele în care poți colabora în prezent cu flota noastră.</span>
      </header>
      <div class="map-shell">
        <div class="map-controls">
          <div class="map-summary"><strong id="map-active-count">41</strong><span>orașe active</span></div>
          <label class="city-search" for="city-search-input">
            <span>Caută un oraș activ</span>
            <span class="city-search-field"><i aria-hidden="true">⌕</i><input id="city-search-input" type="text" autocomplete="off" placeholder="Începe să scrii numele orașului…" /><button id="city-search-clear" type="button" aria-label="Șterge căutarea" hidden>×</button></span>
            <small id="city-search-status" aria-live="polite">41 de orașe afișate</small>
          </label>
        </div>
        <div class="map-frame">
          <svg id="romania-map" class="romania-map" viewBox="0 0 1000 620" role="group" aria-labelledby="map-svg-title map-svg-description">
            <title id="map-svg-title">Harta orașelor active CibeRO din România</title>
            <desc id="map-svg-description">Harta României este segmentată pe județe. Etichetele verzi indică exclusiv orașele în care flota CibeRO este activă.</desc>
          </svg>
          <div class="map-tooltip" id="map-tooltip" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/romania-map-data.js?v=2"></script>
  <script src="../assets/romania-counties.js?v=1"></script>
  <script src="../main-page.js?v=7"></script>
</body>
</html>
