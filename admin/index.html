<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administrare cereri | CibeRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css?v=1" />
</head>
<body>
  <header class="admin-header">
    <a href="../" aria-label="Înapoi la CibeRO"><img src="../assets/cibero-wordmark.png" alt="CibeRO" /></a>
    <span>Administrare cereri</span>
    <button id="logout-button" class="quiet-button" type="button" hidden>Deconectare</button>
  </header>

  <main>
    <section id="login-view" class="login-view" aria-labelledby="login-title">
      <form id="login-form" class="panel login-panel">
        <p class="eyebrow">Acces protejat</p>
        <h1 id="login-title">Panou administrativ</h1>
        <p>Autentifică-te cu utilizatorul administrator creat în Supabase.</p>
        <label>Email<input name="email" type="email" autocomplete="username" required /></label>
        <label>Parolă<input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary-button" type="submit">Autentificare</button>
        <p id="login-feedback" class="feedback" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboard-view" class="dashboard" hidden>
      <div class="dashboard-heading">
        <div><p class="eyebrow">CibeRO Operations</p><h1>Cereri de deschidere cont</h1></div>
        <button id="refresh-button" class="quiet-button" type="button">Actualizează</button>
      </div>

      <div class="summary-grid" aria-label="Rezumat cereri">
        <article><span>Total</span><strong id="total-count">0</strong></article>
        <article><span>Noi</span><strong id="new-count">0</strong></article>
        <article><span>În verificare</span><strong id="reviewing-count">0</strong></article>
        <article><span>Activate</span><strong id="activated-count">0</strong></article>
      </div>

      <div class="panel toolbar">
        <label>Caută<input id="search-filter" type="search" placeholder="Nume, email, telefon sau oraș" /></label>
        <label>Platformă<select id="platform-filter"><option value="">Toate</option><option value="wolt">Wolt</option><option value="glovo">Glovo</option></select></label>
        <label>Status<select id="status-filter"><option value="">Toate</option><option value="new">Nouă</option><option value="reviewing">În verificare</option><option value="sent_to_platform">Trimisă platformei</option><option value="activated">Activată</option><option value="rejected">Respinsă</option><option value="archived">Arhivată</option></select></label>
        <button id="export-button" class="quiet-button" type="button">Exportă CSV</button>
      </div>

      <p id="dashboard-feedback" class="feedback dashboard-feedback" role="status" aria-live="polite"></p>
      <div id="applications-list" class="applications-list"></div>
      <p id="empty-state" class="empty-state" hidden>Nu există cereri pentru filtrele selectate.</p>
    </section>
  </main>

  <dialog id="application-dialog" class="application-dialog">
    <form method="dialog" class="dialog-top"><strong>Detalii cerere</strong><button aria-label="Închide">×</button></form>
    <div id="application-details"></div>
  </dialog>

  <script type="module" src="admin.js?v=1"></script>
</body>
</html>
