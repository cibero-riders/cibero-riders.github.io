<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Trimite o solicitare către echipa CibeRO pentru Bolt Food, Wolt, Glovo, plăți, documente sau deconturi." />
  <title>Trimite un ticket | CibeRO</title>
  <link rel="icon" type="image/png" href="../assets/cibero-favicon.png?v=2" />
  <link rel="apple-touch-icon" href="../assets/cibero-favicon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../site-navigation.css?v=1" />
  <link rel="stylesheet" href="tickete.css?v=5" />
</head>
<body>
  <header class="site-header global-header">
    <a class="brand brand-wordmark" href="../" aria-label="CibeRO, pagina principală"><img src="../assets/cibero-wordmark.png" alt="CibeRO" /></a>
    <button class="menu-toggle" type="button" aria-label="Deschide meniul" aria-controls="main-nav" aria-expanded="false">☰</button>
    <nav id="main-nav" aria-label="Navigație principală">
      <a href="../">Prezentare</a>
      <a href="../orase/">Orașe</a>
      <a href="../campanii/">Campanii</a>
      <a aria-current="page" href="./">Tickete</a>
      <a class="nav-account" href="../deschide-cont.html">Deschide Cont</a>
    </nav>
  </header>

  <main class="ticket-page">
    <div class="ticket-ambient" aria-hidden="true"></div>
    <section class="ticket-shell" aria-labelledby="ticket-page-title">
      <header class="ticket-intro">
        <div>
          <p class="ticket-kicker">CibeRO · Suport curieri</p>
          <h1 id="ticket-page-title">Solicitare către echipă</h1>
          <p>Spune-ne cu ce te putem ajuta. Solicitările sunt analizate, de regulă, în 24–48 de ore.</p>
        </div>
        <div class="language-switch" aria-label="Limbă">
          <button class="active" type="button" data-language="ro" aria-pressed="true">RO</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </header>

      <nav id="stepper" class="ticket-stepper" aria-label="Progres formular"></nav>
      <section id="ticket-stage" class="ticket-stage" aria-live="polite"></section>
    </section>
  </main>

  <dialog id="ticket-dialog" class="ticket-dialog">
    <div id="ticket-dialog-content"></div>
  </dialog>

  <footer class="site-footer">© Powered by Cibero - 2026 | All rights reserved</footer>
  <script type="module" src="tickete.js?v=4"></script>
</body>
</html>
